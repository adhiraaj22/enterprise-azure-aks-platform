name: Terraform CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'ci-test-*'

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.13.5"
  TF_ROOT: "terraform"
  TF_WORKING_DIR: "terraform/environments/dev"

jobs:

  terraform-ci:

    name: Terraform CI - Quality, Security and Plan

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # Checkout
      # ==================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==================================================
      # Setup Terraform
      # ==================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ==================================================
      # Terraform Format
      # ==================================================

      - name: Terraform Format Check
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -recursive


      # ==================================================
      # TFLint
      # ==================================================

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
          cache: true


      - name: Initialize TFLint
        working-directory: ${{ env.TF_ROOT }}
        run: tflint --init --config="${{ github.workspace }}/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}


      - name: Run TFLint
        working-directory: ${{ env.TF_ROOT }}
        run: tflint --recursive --config="${{ github.workspace }}/.tflint.hcl"
        continue-on-error: true


      # ==================================================
      # tfsec
      # ==================================================

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true


      # ==================================================
      # Checkov
      # ==================================================

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: true
          output_format: cli
          log_level: WARNING


      # ==================================================
      # Azure Login
      # ==================================================

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}


      # ==================================================
      # Terraform Init
      # ==================================================

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false


      # ==================================================
      # Terraform Validate
      # ==================================================

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


      # ==================================================
      # Terraform Plan
      # ==================================================

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_postgresql_admin_password: ${{ secrets.POSTGRESQL_ADMIN_PASSWORD }}
        run: terraform plan -input=false